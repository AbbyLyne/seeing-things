version: 2

models:
  - name: f1_grid_vs_finish
    description: "Exhibit 1 story table. One row per classified finisher who started from the grid, 2022-2025. Pit-lane starts and unclassified drivers are excluded."
    columns:
      - name: result_id
        description: "Season, round and driver ID joined: unique per row."
        data_tests:
          - unique
          - not_null

      - name: grid
        description: "Starting position, 1 = pole. Pit-lane starts (0) are excluded."
        data_tests:
          - not_null

      - name: finish_position
        description: "Official finishing position (1 = winner). Never blank here, because every row is a classified finisher."
        data_tests:
          - not_null

      - name: places_gained
        description: "Grid position minus finishing position. Positive = moved forward (started 5th, finished 2nd = +3); negative = lost places."

      - name: team_avg_gained
        description: "Average places_gained for the driver's team in that season, repeated on every row for that team and season. Compares a driver with their team's typical race."